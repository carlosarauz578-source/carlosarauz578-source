<svg width="700" height="720" viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente interior del triángulo central (Fondo gris oscuro/pizarra contrastante) -->
    <linearGradient id="tri-space" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Recorte exacto para forma triangular pura en GitHub -->
    <clipPath id="triangle-clip">
      <polygon points="350,15 670,700 30,700"/>
    </clipPath>

    <!-- Filtros de brillo dinámico -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes glowPulse { 0% { opacity: 0.6; filter: drop-shadow(0 0 3px currentColor); } 50% { opacity: 1; filter: drop-shadow(0 0 10px currentColor); } 100% { opacity: 0.6; filter: drop-shadow(0 0 3px currentColor); } }
    @keyframes floatElem { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
    @keyframes nodePulse { 0% { r: 5; opacity: 0.7; } 50% { r: 8; opacity: 1; } 100% { r: 5; opacity: 0.7; } }
    
    .star-blink { animation: blink 1.5s ease-in-out infinite; }
    .glowing-text { animation: glowPulse 2.5s ease-in-out infinite; }
    .anim-float { animation: floatElem 3s ease-in-out infinite; transform-origin: center; }
    
    /* Conexiones con gran visibilidad */
    .path-galactic { stroke: #38bdf8; stroke-dasharray: 4 4; opacity: 0.85; fill: none; stroke-width: 2.5; }
    .path-celestial { stroke: #f43f5e; stroke-dasharray: 4 4; opacity: 0.85; fill: none; stroke-width: 2.5; }
    .path-terrestrial { stroke: #4ade80; stroke-dasharray: 4 4; opacity: 0.85; fill: none; stroke-width: 2.5; }
    
    .node-orbit { animation: nodePulse 2s infinite; }
  </style>

  <!-- ================= CONEXIONES Y NODOS GALÁCTICOS EXTERIORES ================= -->
  <!-- Órbita Celestial / Espacial -->
  <path d="M 350,55 Q 190,30 90,85" class="path-celestial"/>
  <path d="M 350,55 Q 510,30 610,85" class="path-celestial"/>
  
  <circle cx="90" cy="85" r="6" fill="#f43f5e" class="node-orbit"/>
  <text x="25" y="65" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="bold">CCSP / CISM (ISC²)</text>
  
  <circle cx="610" cy="85" r="6" fill="#f43f5e" class="node-orbit"/>
  <text x="515" y="65" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="bold">CyberWarFare Labs</text>

  <!-- Órbita Intermedia / Atmósfera -->
  <path d="M 230,230 Q 120,200 65,280" class="path-galactic"/>
  <path d="M 470,230 Q 580,200 635,280" class="path-galactic"/>

  <circle cx="65" cy="280" r="6" fill="#38bdf8" class="node-orbit"/>
  <text x="15" y="260" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">HTB CPTS / Academy</text>

  <circle cx="635" cy="280" r="6" fill="#38bdf8" class="node-orbit"/>
  <text x="520" y="260" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">SBT: Threat Hunting / OSINT</text>

  <!-- Órbita Terrestre / Edificios y Operaciones -->
  <path d="M 190,430 Q 90,410 35,490" class="path-terrestrial"/>
  <path d="M 510,430 Q 610,410 665,490" class="path-terrestrial"/>

  <circle cx="35" cy="490" r="6" fill="#4ade80" class="node-orbit"/>
  <text x="15" y="470" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">NDG Linux / TryHackMe</text>

  <circle cx="665" cy="490" r="6" fill="#4ade80" class="node-orbit"/>
  <text x="535" y="470" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">SBT: DFIR &amp; Vuln Mgmt</text>


  <!-- ================= CONTENEDOR PIRAMIDAL CENTRAL (Recortado como Triángulo) ================= -->
  <g clip-path="url(#triangle-clip)">
    <!-- Fondo interno -->
    <polygon points="350,15 670,700 30,700" fill="url(#tri-space)"/>

    <!-- TÍTULO PRINCIPAL -->
    <text x="350" y="52" fill="#00FFFF" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="2" class="glowing-text">CERT_HIERARCHY // 0-100</text>

    <!-- ================= NIVEL 4: ORBITA / ÉLITE ================= -->
    <g>
      <polygon points="350,68 410,175 290,175" fill="#2c1035" stroke="#FF0055" stroke-width="2.5"/>
      <circle cx="315" cy="95" r="2.5" fill="#FFF" class="star-blink"/>
      <g class="anim-float">
        <text x="350" y="125" font-size="22" text-anchor="middle">🛸</text>
      </g>
      <text x="350" y="152" fill="#FF0055" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" class="glowing-text">CISSP / CISM (ISC²)</text>
      <text x="430" y="125" fill="#FF0055" font-family="monospace" font-size="13" font-weight="bold" class="glowing-text">LVL 100</text>
    </g>

    <!-- ================= NIVEL 3: CIELO / AVANZADO ================= -->
    <g>
      <polygon points="287,178 413,178 465,310 235,310" fill="#351a08" stroke="#FF5500" stroke-width="2.5"/>
      <text x="255" y="222" font-size="15" class="star-blink">✨</text>
      <g class="anim-float">
        <text x="350" y="235" font-size="22" text-anchor="middle">🎈</text>
      </g>
      <text x="435" y="222" font-size="15">🕊️</text>
      <text x="350" y="265" fill="#FF5500" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" class="glowing-text">OSCP / Advanced Offensive</text>
      <text x="485" y="250" fill="#FF5500" font-family="monospace" font-size="13" font-weight="bold" class="glowing-text">LVL 90</text>
    </g>

    <!-- ================= NIVEL 2: EDIFICIOS / INTERMEDIO ================= -->
    <g>
      <polygon points="232,313 468,313 520,450 180,450" fill="#353008" stroke="#FFCC00" stroke-width="2.5"/>
      <text x="200" y="382" font-size="18">🏢</text>
      <g class="anim-float">
        <text x="350" y="390" font-size="22" text-anchor="middle">🧗‍♂️</text>
      </g>
      <text x="490" y="382" font-size="18">🏢</text>
      <text x="350" y="415" fill="#FFCC00" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" class="glowing-text">AWS Arch / CEH / DefensityOne</text>
      <text x="540" y="390" fill="#FFCC00" font-family="monospace" font-size="13" font-weight="bold" class="glowing-text">LVL 75</text>
    </g>

    <!-- ================= NIVEL 1: TRÁNSITO / OPERACIONAL ================= -->
    <g>
      <polygon points="177,453 523,453 575,590 125,590" fill="#08351d" stroke="#00FF66" stroke-width="2.5"/>
      <text x="235" y="522" font-size="18">🛣️</text>
      <g class="anim-float">
        <text x="350" y="530" font-size="22" text-anchor="middle">🚶‍♂️</text>
      </g>
      <text x="350" y="558" fill="#00FF66" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" class="glowing-text">CCNA / AZ-104 / TryHackMe / NDG Linux</text>
      <text x="595" y="522" fill="#00FF66" font-family="monospace" font-size="13" font-weight="bold" class="glowing-text">LVL 50</text>
    </g>

    <!-- ================= NIVEL 0: TIERRA / FUNDAMENTOS ================= -->
    <g>
      <polygon points="122,593 578,593 670,700 30,700" fill="#0c253d" stroke="#00CCFF" stroke-width="2.5"/>
      <text x="350" y="630" font-size="16" text-anchor="middle">🌱 🪨 🔑</text>
      <text x="350" y="658" fill="#00CCFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" class="glowing-text">Security+ / AZ-900 / Google Cyber / Microsoft Learn</text>
    </g>
  </g>

  <!-- BORDE EXTERIOR NEÓN DEL TRIÁNGULO -->
  <polygon points="350,15 670,700 30,700" fill="none" stroke="#00FFFF" stroke-width="4" filter="url(#neon-glow)"/>
</svg>
