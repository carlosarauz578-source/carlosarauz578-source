<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .bg { fill: #0c1324; stroke: #00f0ff; stroke-opacity: 0.4; stroke-width: 1.5; rx: 12px; }
    .title { font-family: 'Segoe UI', Roboto, sans-serif; fill: #00f0ff; font-size: 16px; font-weight: bold; letter-spacing: 2px; }
    .desc { font-family: 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; font-size: 13px; line-height: 1.5; }
    .icon-bg { fill: #1e293b; stroke: #00f0ff; stroke-opacity: 0.3; stroke-width: 1; rx: 8px; transition: all 0.3s ease; }
    .icon-bg:hover { fill: #0f172a; stroke: #00f0ff; stroke-opacity: 1; filter: drop-shadow(0px 0px 8px rgba(0, 240, 255, 0.8)); cursor: pointer; }
    .label { font-family: 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; font-size: 9px; font-weight: 600; text-anchor: middle; }

    /* Animaciones de parpadeo y destello */
    @keyframes fast-blink {
      0% { opacity: 0.2; filter: drop-shadow(0px 0px 2px rgba(0, 240, 255, 0.2)); }
      30% { opacity: 1; filter: drop-shadow(0px 0px 12px rgba(0, 240, 255, 1)); }
      60% { opacity: 0.4; filter: drop-shadow(0px 0px 4px rgba(0, 240, 255, 0.4)); }
      100% { opacity: 0.2; filter: drop-shadow(0px 0px 2px rgba(0, 240, 255, 0.2)); }
    }

    @keyframes engine-flash {
      0% { opacity: 0.3; transform: scaleX(0.8); }
      50% { opacity: 1; filter: drop-shadow(0px 0px 10px #ff0055); transform: scaleX(1.2); }
      100% { opacity: 0.3; transform: scaleX(0.8); }
    }

    .ship-blink { animation: fast-blink 1.8s ease-in-out infinite; }
    .engine-blink { animation: engine-flash 0.8s ease-in-out infinite; transform-origin: left center; }
  </style>

  <!-- Fondo de la tarjeta -->
  <rect x="2" y="2" width="896" height="236" class="bg" />

  <!-- Título -->
  <text x="30" y="45" class="title">🛰️ // ORBITAL_CORE_PROFILE</text>

  <!-- Descripción -->
  <text x="30" y="80" class="desc">Comandante de sistemas distribuidos y ciberseguridad avanzada en entornos descentralizados.</text>
  <text x="30" y="100" class="desc">Especialista en fortificación de smart contracts y despliegue de nodos en redes orbitales.</text>

  <!-- NAVES ESPACIALES -->
  <g class="ship-blink" transform="translate(770, 20)">
    <path d="M0 12 L28 4 L42 12 L28 20 L0 12Z" fill="#334155" stroke="#00f0ff" stroke-width="1.2"/>
    <path d="M16 10 L24 10 L26 14 L14 14 Z" fill="#00f0ff" />
    <path d="M12 6 L18 2 L22 4 L16 10 Z" fill="#475569" />
    <path d="M12 18 L18 22 L22 20 L16 14 Z" fill="#475569" />
    <path d="M0 12 L-10 8 L-6 12 L-10 16 Z" fill="#ff0055" class="engine-blink" />
  </g>

  <g class="ship-blink" style="animation-delay: 0.9s;" transform="translate(650, 68)">
    <path d="M36 8 L6 0 L14 8 L6 16 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <ellipse cx="22" cy="8" rx="4" ry="2.5" fill="#38bdf8" />
    <path d="M6 8 L-2 4 L2 8 L-2 12 Z" fill="#00f0ff" class="engine-blink" />
  </g>

