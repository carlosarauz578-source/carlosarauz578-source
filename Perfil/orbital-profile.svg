  <!-- 15. Docker -->
  <a xlink:href="https://www.docker.com/" target="_blank">
    <g transform="translate(814, 135)">
      <rect width="46" height="46" class="icon-bg" />
      <path d="M16 20H18V22H16V20ZM19 20H21V22H19V20ZM22 20H24V22H22V20ZM19 17H21V19H19V17ZM22 17H24V19H22V17ZM16 23H27C27 23 28 26 25 27C22 28 15 28 16 23Z" fill="#2496ED"/>
