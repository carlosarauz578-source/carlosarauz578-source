      <rect width="46" height="46" class="icon-bg" />
      <rect x="15" y="13" width="16" height="13" rx="2" fill="#183A61" stroke="#31658C" stroke-width="1.5"/>
      <circle cx="23" cy="29" r="2" fill="#00f0ff"/>
      <text x="23" y="41" class="label">VBOX</text>
    </g>
  </a>

