    </g>
  </a>

  <!-- 12. Python -->
  <a xlink:href="https://www.python.org/" target="_blank">
    <g transform="translate(646, 135)">
      <rect width="46" height="46" class="icon-bg" />
      <path d="M19 15C17 15 17 17 17 19V21C17 23 18 23 20 23H22V25H18C16 25 15 24 15 21V19C15 16 17 13 21 13H25C27 13 28 14 28 17V19H26V17C26 15 25 15 23 15H19Z" fill="#3776AB"/>
