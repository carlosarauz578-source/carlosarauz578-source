name: Generate Custom Security Animation

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta automáticamente todos los días
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run generation script
        run: python scripts/generate.py

      - name: Push generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
