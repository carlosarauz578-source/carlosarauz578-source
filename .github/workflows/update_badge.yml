name: Update Cyber Badge

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a la medianoche
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate SVG Badge
        run: python generate_badge.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/space-defender.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update space defender badge stats" && git push)
